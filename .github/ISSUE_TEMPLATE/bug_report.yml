name: Bug report / 问题报告
description: Provide a reproducible example / 提供可复现步骤。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Remove keys, personal/company data and complete provider responses. Follow SECURITY.md for vulnerabilities. 请勿公开敏感资料。
  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: OS, Python / Node, demo / cloud mode, revision and selected UI language.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction / 复现步骤
      description: Use fictional data and describe actual versus expected behavior. / 使用虚构数据。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence / 脱敏记录
      description: Redacted run ID, error, trace or screenshot. Never paste .env. / 不要粘贴密钥。
