[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deskpilot"
version = "0.1.0"
description = "Evidence-first IT service desk with governed RAG and durable approvals"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20",
  "langgraph>=0.6,<2", "langgraph-checkpoint-sqlite>=2,<4",
  "qdrant-client>=1.13,<2", "jieba>=0.42.1", "rank-bm25>=0.2.2",
  "pypdf>=5,<7", "python-docx>=1.1,<2", "pyyaml>=6,<7",
  "mcp>=1.28,<2", "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6", "ruff>=0.11", "respx>=0.22"]

[project.scripts]
deskpilot = "deskpilot.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
filterwarnings = ["ignore:pkg_resources is deprecated:UserWarning"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
